<svg xmlns="http://www.w3.org/2000/svg" width="<%= large ? 960 : 480 %>" height="99999" class="dashboard-pure <%= large ? 'large' : '' %> <%= !animated ? 'no-animations' : '' %>">

  <defs>
    <style><%= fonts %></style>
    <!-- Define reusable gradients for dashboard sections -->
    <linearGradient id="gradient-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.15" />
    </linearGradient>
    <linearGradient id="gradient-activity" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#34d399;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="gradient-languages" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="gradient-achievements" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="gradient-community" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <style data-optimizable="true"><%= style %></style>
  <style><%= extras.css %></style>

  <!-- Dashboard Pure SVG layout - comprehensive multi-panel view -->
  <g class="metrics-container" transform="translate(10, 10)">
    <%
      let yOffset = 0
      const width = large ? 940 : 460
      const padding = 15
      const lineHeight = 20
      const columnGap = 20
      const columnWidth = large ? (width - columnGap) / 2 : width
    %>

    <% if (warnings.length) { %>
      <!-- Warning Section -->
      <g class="warning-section" transform="translate(0, <%= yOffset %>)">
        <rect x="0" y="0" width="<%= width %>" height="50" fill="#fee" rx="8"/>
        <rect x="0" y="0" width="<%= width %>" height="50" fill="none" stroke="#f87171" stroke-width="1" rx="8"/>
        <text x="20" y="30" fill="#dc2626" font-size="14" font-weight="500">
          ⚠ <%= warnings.map(({warning}) => warning.message).join(", ") %>
        </text>
      </g>
      <% yOffset += 60 %>
    <% } %>

    <!-- HEADER SECTION (Full width) -->
    <% if (base.header) { %>
      <g class="dashboard-section header-section" transform="translate(0, <%= yOffset %>)">
        <%- await include(`partials/dashboard.header.ejs`, {yOffset: 0, width, padding, lineHeight, columnWidth}) %>
      </g>
      <% yOffset += 130 %>
    <% } %>

    <!-- TWO COLUMN LAYOUT BEGINS -->
    <% if (large) { %>
      <%
        let leftColumnY = yOffset
        let rightColumnY = yOffset
        const leftColumnX = 0
        const rightColumnX = columnWidth + columnGap
      %>

      <!-- LEFT COLUMN -->
      <g class="dashboard-left-column" transform="translate(<%= leftColumnX %>, 0)">

        <!-- Activity Panel -->
        <% if (base.activity) { %>
          <g class="dashboard-section activity-section" transform="translate(0, <%= leftColumnY %>)">
            <%- await include(`partials/dashboard.activity.ejs`, {yOffset: 0, width: columnWidth, padding, lineHeight}) %>
          </g>
          <% leftColumnY += 220 %>
        <% } %>

        <!-- Languages Panel -->
        <% if (plugins.languages) { %>
          <g class="dashboard-section languages-section" transform="translate(0, <%= leftColumnY %>)">
            <%- await include(`partials/dashboard.languages.ejs`, {yOffset: 0, width: columnWidth, padding, lineHeight}) %>
          </g>
          <%
            const languagesCount = Math.min(8, plugins.languages?.favorites?.length || 0)
            leftColumnY += 100 + languagesCount * 23
          %>
        <% } %>

        <!-- Repositories Panel -->
        <% if (base.repositories) { %>
          <g class="dashboard-section repositories-section" transform="translate(0, <%= leftColumnY %>)">
            <%- await include(`partials/dashboard.repositories.ejs`, {yOffset: 0, width: columnWidth, padding, lineHeight}) %>
          </g>
          <%
            const reposCount = Math.min(5, data?.user?.repositories?.nodes?.length || 0)
            leftColumnY += 70 + reposCount * 50
          %>
        <% } %>
      </g>

      <!-- RIGHT COLUMN -->
      <g class="dashboard-right-column" transform="translate(<%= rightColumnX %>, 0)">

        <!-- Community Panel -->
        <% if (base.community) { %>
          <g class="dashboard-section community-section" transform="translate(0, <%= rightColumnY %>)">
            <%- await include(`partials/dashboard.community.ejs`, {yOffset: 0, width: columnWidth, padding, lineHeight}) %>
          </g>
          <% rightColumnY += 220 %>
        <% } %>

        <!-- Achievements Panel -->
        <% if (plugins.achievements) { %>
          <g class="dashboard-section achievements-section" transform="translate(0, <%= rightColumnY %>)">
            <%- await include(`partials/dashboard.achievements.ejs`, {yOffset: 0, width: columnWidth, padding, lineHeight}) %>
          </g>
          <%
            const achievementsCount = Math.min(6, plugins.achievements?.list?.length || 0)
            rightColumnY += 70 + achievementsCount * 70
          %>
        <% } %>

        <!-- Contribution Calendar (if activity enabled) -->
        <% if (base.activity && computed.calendar && computed.calendar.length) { %>
          <g class="dashboard-section calendar-section" transform="translate(0, <%= rightColumnY %>)">
            <%- await include(`partials/dashboard.calendar.ejs`, {yOffset: 0, width: columnWidth, padding, lineHeight}) %>
          </g>
          <% rightColumnY += 180 %>
        <% } %>
      </g>

      <% yOffset = Math.max(leftColumnY, rightColumnY) %>
    <% } else { %>
      <!-- SINGLE COLUMN LAYOUT (non-large display) -->

      <!-- Activity Panel -->
      <% if (base.activity) { %>
        <g class="dashboard-section activity-section" transform="translate(0, <%= yOffset %>)">
          <%- await include(`partials/dashboard.activity.ejs`, {yOffset: 0, width, padding, lineHeight}) %>
        </g>
        <% yOffset += 230 %>
      <% } %>

      <!-- Community Panel -->
      <% if (base.community) { %>
        <g class="dashboard-section community-section" transform="translate(0, <%= yOffset %>)">
          <%- await include(`partials/dashboard.community.ejs`, {yOffset: 0, width, padding, lineHeight}) %>
        </g>
        <% yOffset += 230 %>
      <% } %>

      <!-- Languages Panel -->
      <% if (plugins.languages) { %>
        <g class="dashboard-section languages-section" transform="translate(0, <%= yOffset %>)">
          <%- await include(`partials/dashboard.languages.ejs`, {yOffset: 0, width, padding, lineHeight}) %>
        </g>
        <%
          const languagesCount = Math.min(8, plugins.languages?.favorites?.length || 0)
          yOffset += 100 + languagesCount * 23
        %>
      <% } %>

      <!-- Repositories Panel -->
      <% if (base.repositories) { %>
        <g class="dashboard-section repositories-section" transform="translate(0, <%= yOffset %>)">
          <%- await include(`partials/dashboard.repositories.ejs`, {yOffset: 0, width, padding, lineHeight}) %>
        </g>
        <%
          const reposCount = Math.min(5, data?.user?.repositories?.nodes?.length || 0)
          yOffset += 70 + reposCount * 50
        %>
      <% } %>

      <!-- Achievements Panel -->
      <% if (plugins.achievements) { %>
        <g class="dashboard-section achievements-section" transform="translate(0, <%= yOffset %>)">
          <%- await include(`partials/dashboard.achievements.ejs`, {yOffset: 0, width, padding, lineHeight}) %>
        </g>
        <%
          const achievementsCount = Math.min(6, plugins.achievements?.list?.length || 0)
          yOffset += 70 + achievementsCount * 70
        %>
      <% } %>
    <% } %>

    <% if (base.metadata) { %>
      <!-- Footer Section -->
      <g class="footer-section" transform="translate(0, <%= yOffset + 20 %>)">
        <rect x="0" y="0" width="<%= width %>" height="1" fill="#e1e4e8" opacity="0.3"/>
        <text x="<%= width / 2 %>" y="25" text-anchor="middle" fill="#586069" font-size="11" opacity="0.7">
          <% if (account === "user") { %>
            <tspan>These metrics <%= !computed.token.scopes.includes("repo") ? "do not include all" : "include" %> private contributions</tspan>
            <tspan x="<%= width / 2 %>" dy="15">
          <% } %>
          Last updated <%= meta.generated %>
          <% if ((config.timezone?.name)&&(!config.timezone?.error)) { %>
            (timezone <%= config.timezone.name %>)
          <% } %>
          with lowlighter/metrics@<%= meta.version %>
          <% if (account === "user") { %>
            </tspan>
          <% } %>
        </text>
      </g>
      <% yOffset += 60 %>
    <% } %>

    <!-- End marker for height calculation -->
    <rect id="metrics-end" x="0" y="<%= yOffset %>" width="1" height="1" opacity="0"/>
  </g>

</svg>
