<svg xmlns="http://www.w3.org/2000/svg" width="<%= large ? 960 : 480 %>" height="99999" class="pure classic-pure <%= large ? 'large' : '' %> <%= !animated ? 'no-animations' : '' %>">

  <defs>
    <style><%= fonts %></style>
    <!-- Define reusable gradients -->
    <linearGradient id="gradient-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0366d6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#0969da;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="gradient-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f6f8fa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <style data-optimizable="true"><%= style %></style>
  <style><%= extras.css %></style>

  <!-- Pure SVG layout - no foreignObject! Classic GitHub styling -->
  <g class="metrics-container" transform="translate(10, 10)">
    <%
      let yOffset = 0
      const width = large ? 940 : 460
      const padding = 10
      const lineHeight = 20
    %>

    <% if (warnings.length) { %>
      <!-- Warning Section -->
      <g class="warning-section" transform="translate(0, <%= yOffset %>)">
        <rect x="0" y="0" width="<%= width %>" height="40" fill="#fff8c5" rx="6"/>
        <rect x="0" y="0" width="<%= width %>" height="40" fill="none" stroke="#D79533" stroke-width="1" rx="6"/>
        <text x="20" y="25" fill="#D79533" font-size="14" font-weight="500">
          ⚠ <%= warnings.map(({warning}) => warning.message).join(", ") %>
        </text>
      </g>
      <% yOffset += 50 %>
    <% } %>

    <!-- Render partials -->
    <% for (const partial of [...partials]) { %>
      <g class="partial-<%= partial.replace(/\./g, '-') %>" transform="translate(0, <%= yOffset %>)">
        <%- await include(`partials/${partial}.ejs`, {yOffset: 0, width, padding, lineHeight}) %>
      </g>
      <%
        // Each partial should export its height
        // For now, we'll estimate based on partial type
        const heights = {
          'base.header': 140,
          'base.activity+community': 120,
          'base.repositories': 150,
          'languages': 200,
          'achievements': 250,
          'activity': 300,
          'habits': 350,
          'notable': 120,
          'isocalendar': 400,
        }
        yOffset += (heights[partial] || 120) + 20
      %>
    <% } %>

    <% if (base.metadata) { %>
      <!-- Footer Section -->
      <g class="footer-section" transform="translate(0, <%= yOffset %>)">
        <line x1="0" y1="0" x2="<%= width %>" y2="0" stroke="#e1e4e8" stroke-width="1"/>
        <text x="<%= width / 2 %>" y="25" text-anchor="middle" fill="#586069" font-size="11" opacity="0.8">
          <% if (account === "user") { %>
            <tspan>These metrics <%= !computed.token.scopes.includes("repo") ? "do not include all" : "include" %> private contributions</tspan>
            <tspan x="<%= width / 2 %>" dy="15">
          <% } %>
          Last updated <%= meta.generated %>
          <% if ((config.timezone?.name)&&(!config.timezone?.error)) { %>
            (timezone <%= config.timezone.name %>)
          <% } %>
          with lowlighter/metrics@<%= meta.version %>
          <% if (account === "user") { %>
            </tspan>
          <% } %>
        </text>
      </g>
      <% yOffset += 60 %>
    <% } %>

    <!-- End marker for height calculation -->
    <rect id="metrics-end" x="0" y="<%= yOffset %>" width="1" height="1" opacity="0"/>
  </g>

</svg>
