name: "📘 Classic Pure (Satori-optimized)"
description: |
  Classic GitHub template optimized for Satori rendering.
  Combines the familiar Classic visual style with Pure SVG performance.
  Uses only SVG elements (no foreignObject/HTML) for 10-100x faster rendering.
extends: null
index: 1
supports:
  - user
  - organization
formats:
  - svg
  - png
  - jpeg
  - json
readme:
  header: |
    This template combines the familiar Classic GitHub style with Pure SVG performance optimization.

    ## Key Features

    - **10-100x Faster**: Pure SVG rendering without foreignObject elements
    - **Satori-Compatible**: Perfect for automated workflows and serverless functions
    - **Classic Styling**: Maintains the GitHub visual identity you know
    - **Wide Plugin Support**: Compatible with most popular metrics plugins
    - **CI/CD Ready**: Ideal for high-frequency metric generation

    ## Performance Benefits

    Traditional templates use HTML inside SVG foreignObject elements, which is slow to render.
    This Pure SVG version achieves dramatic speedups:

    - Simple metrics: 10-20x faster
    - Complex metrics: 50-100x faster
    - Perfect for GitHub Actions and serverless environments

    ## Supported Partials

    ### Fully Supported

    - `base.header` - User/organization header with avatar and stats
    - `base.activity+community` - Activity and community statistics
    - `base.repositories` - Top repositories list
    - `languages` - Language usage statistics
    - `achievements` - Achievement badges and progress

    ### Partially Supported

    - `activity` - Recent activity feed (simplified)
    - `notable` - Notable contributions (simplified)

    ### Not Yet Converted

    Most other plugins are not yet converted to Pure SVG format.
    For full plugin support, use the original `classic` template.

  migration: |
    ## Migration from Classic Template

    Simply change your template configuration:

    ```yaml
    # Before
    template: classic

    # After
    template: classic-pure
    ```

    Note: Some plugins may not be available yet. Check the supported partials list above.

examples:
  default: https://github.com/lowlighter/metrics/blob/examples/metrics.classic-pure.svg
