<svg xmlns="http://www.w3.org/2000/svg" width="600" height="99999" class="profile-pure <%= !animated ? 'no-animations' : '' %> <%= config.theme || 'default' %>-theme">

  <defs>
    <style><%= fonts %></style>

    <!-- Theme gradients -->
    <linearGradient id="gradient-hero-default" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.15" />
    </linearGradient>

    <linearGradient id="gradient-hero-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:0.15" />
    </linearGradient>

    <linearGradient id="gradient-hero-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.15" />
    </linearGradient>

    <linearGradient id="gradient-hero-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.15" />
    </linearGradient>

    <linearGradient id="gradient-hero-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ef4444;stop-opacity:0.15" />
    </linearGradient>

    <!-- Card shadow effect -->
    <filter id="card-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.05"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style data-optimizable="true"><%= style %></style>
  <style><%= extras.css %></style>

  <!-- Profile Pure SVG layout -->
  <g class="profile-container" transform="translate(15, 15)">
    <%
      let yOffset = 0
      const width = 570
      const padding = 20
      const lineHeight = 20
      const sectionSpacing = 25

      // Get theme color
      const theme = config.theme || 'default'
      const gradientId = `gradient-hero-${theme}`
    %>

    <% if (warnings.length) { %>
      <!-- Warning Section -->
      <g class="warning-section" transform="translate(0, <%= yOffset %>)">
        <rect x="0" y="0" width="<%= width %>" height="40" fill="#fee" rx="6"/>
        <text x="20" y="25" fill="#c00" font-size="14" font-weight="500">
          ⚠ <%= warnings.map(({warning}) => warning.message).join(", ") %>
        </text>
      </g>
      <% yOffset += 50 %>
    <% } %>

    <!-- Hero Section -->
    <g class="section-hero" transform="translate(0, <%= yOffset %>)">
      <%- await include(`partials/profile.hero.ejs`, {
        yOffset: 0,
        width,
        padding,
        lineHeight,
        gradientId,
        tagline: config.tagline || '',
        bio: config.bio || '',
        status: config.status || ''
      }) %>
    </g>
    <% yOffset += 240 %>

    <!-- Skills Section -->
    <% if (plugins.languages) { %>
      <g class="section-skills" transform="translate(0, <%= yOffset %>)">
        <%- await include(`partials/profile.skills.ejs`, {
          yOffset: 0,
          width,
          padding,
          lineHeight
        }) %>
      </g>
      <% yOffset += 220 + sectionSpacing %>
    <% } %>

    <!-- Highlights Section (Featured Repos) -->
    <% if (base.repositories) { %>
      <g class="section-highlights" transform="translate(0, <%= yOffset %>)">
        <%- await include(`partials/profile.highlights.ejs`, {
          yOffset: 0,
          width,
          padding,
          lineHeight
        }) %>
      </g>
      <% yOffset += 200 + sectionSpacing %>
    <% } %>

    <!-- Community Section -->
    <g class="section-community" transform="translate(0, <%= yOffset %>)">
      <%- await include(`partials/profile.community.ejs`, {
        yOffset: 0,
        width,
        padding,
        lineHeight
      }) %>
    </g>
    <% yOffset += 120 + sectionSpacing %>

    <!-- Achievements Section -->
    <% if (plugins.achievements) { %>
      <g class="section-achievements" transform="translate(0, <%= yOffset %>)">
        <%- await include(`partials/profile.achievements.ejs`, {
          yOffset: 0,
          width,
          padding,
          lineHeight
        }) %>
      </g>
      <% yOffset += 180 + sectionSpacing %>
    <% } %>

    <% if (base.metadata) { %>
      <!-- Footer Section -->
      <g class="footer-section" transform="translate(0, <%= yOffset %>)">
        <rect x="0" y="0" width="<%= width %>" height="1" fill="#e1e4e8" opacity="0.2"/>
        <text x="<%= width / 2 %>" y="25" text-anchor="middle" fill="#586069" font-size="10" opacity="0.7">
          Last updated <%= meta.generated %> with lowlighter/metrics@<%= meta.version %>
        </text>
      </g>
      <% yOffset += 50 %>
    <% } %>

    <!-- End marker for height calculation -->
    <rect id="metrics-end" x="0" y="<%= yOffset %>" width="1" height="1" opacity="0"/>
  </g>

</svg>
