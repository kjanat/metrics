<svg xmlns="http://www.w3.org/2000/svg" width="<%= large ? 960 : 480 %>" height="99999" class="pure repository-pure <%= large ? 'large' : '' %> <%= !animated ? 'no-animations' : '' %>">

  <defs>
    <style><%= fonts %></style>
    <!-- Gradients for visual polish -->
    <linearGradient id="gradient-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0366d6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#6f42c1;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <style data-optimizable="true"><%= style %></style>
  <style><%= extras.css %></style>

  <!-- Pure SVG layout - no foreignObject! -->
  <g class="metrics-container" transform="translate(10, 10)">
    <%
      let yOffset = 0
      const width = large ? 940 : 460
      const padding = 10
      const lineHeight = 20
    %>

    <% if (warnings.length) { %>
      <!-- Warning Section -->
      <g class="warning-section" transform="translate(0, <%= yOffset %>)">
        <rect x="0" y="0" width="<%= width %>" height="40" fill="#fff3cd" rx="6"/>
        <rect x="0" y="0" width="<%= width %>" height="40" fill="none" stroke="#ffc107" stroke-width="1" rx="6"/>
        <text x="20" y="25" fill="#856404" font-size="14" font-weight="500">
          ⚠ <%= warnings.map(({warning}) => warning.message).join(", ") %>
        </text>
      </g>
      <% yOffset += 50 %>
    <% } %>

    <% if (errors.length) { %>
      <!-- Error Section -->
      <g class="error-section" transform="translate(0, <%= yOffset %>)">
        <rect x="0" y="0" width="<%= width %>" height="40" fill="#f8d7da" rx="6"/>
        <rect x="0" y="0" width="<%= width %>" height="40" fill="none" stroke="#dc3545" stroke-width="1" rx="6"/>
        <text x="20" y="25" fill="#721c24" font-size="14" font-weight="500">
          ❌ <%= errors.map(({error}) => error.message).join(", ") %>
        </text>
      </g>
      <% yOffset += 50 %>
    <% } else { %>
      <!-- Render partials -->
      <% for (const partial of [...partials]) { %>
        <g class="partial-<%= partial %>" transform="translate(0, <%= yOffset %>)">
          <%- await include(`partials/${partial}.ejs`, {yOffset: 0, width, padding, lineHeight}) %>
        </g>
        <%
          // Estimate heights for different partials
          const heights = {
            'base.header': 140,
            'activity': 400,
            'contributors': 200,
            'crypto': 150,
            'followup': 350,
            'introduction': 150,
            'languages': 180,
            'licenses': 300,
            'lines': 50,
            'pagespeed': 300,
            'people': 200,
            'posts': 250,
            'projects': 250,
            'rss': 200,
            'screenshot': 200,
            'sponsors': 180,
            'stargazers': 200,
            'stock': 180,
            'traffic': 50,
          }
          yOffset += heights[partial] || 100
        %>
      <% } %>
    <% } %>

    <% if (base.metadata) { %>
      <!-- Footer Section -->
      <g class="footer-section" transform="translate(0, <%= yOffset %>)">
        <rect x="0" y="0" width="<%= width %>" height="1" fill="#e1e4e8" opacity="0.3"/>
        <text x="<%= width / 2 %>" y="25" text-anchor="middle" fill="#586069" font-size="10" opacity="0.8">
          Last updated <%= meta.generated %> with lowlighter/metrics@<%= meta.version %>
        </text>
      </g>
      <% yOffset += 40 %>
    <% } %>

    <!-- End marker for height calculation -->
    <rect id="metrics-end" x="0" y="<%= yOffset %>" width="1" height="1" opacity="0"/>
  </g>

</svg>
