readme:
  header: |
    This template is a high-performance Pure SVG version of the Repository template.
    It eliminates HTML foreignObject elements for dramatic speed improvements with Satori.

    Key features:
    - 🚀 10-100x faster rendering than standard template
    - 📦 Pure SVG elements only (no foreignObject)
    - 🎯 Satori-compatible for ultra-fast server-side rendering
    - 🎨 Clean, GitHub-inspired design
    - 🔌 Supports most repository plugins

    Performance comparison:
    - Standard Repository template: ~200-500ms per render
    - Pure SVG Repository template: ~5-20ms per render

    Note: Some visual features are simplified for performance.
