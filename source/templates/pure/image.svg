<svg xmlns="http://www.w3.org/2000/svg" width="<%= large ? 960 : 480 %>" height="99999" class="pure <%= large ? 'large' : '' %> <%= !animated ? 'no-animations' : '' %>">

  <defs>
    <style><%= fonts %></style>
    <!-- Define reusable gradients -->
    <linearGradient id="gradient-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:0.1" />
    </linearGradient>
  </defs>

  <style data-optimizable="true"><%= style %></style>
  <style><%= extras.css %></style>

  <!-- Pure SVG layout - no foreignObject! -->
  <g class="metrics-container" transform="translate(10, 10)">
    <%
      let yOffset = 0
      const width = large ? 940 : 460
      const padding = 10
      const lineHeight = 20
    %>

    <% if (warnings.length) { %>
      <!-- Warning Section -->
      <g class="warning-section" transform="translate(0, <%= yOffset %>)">
        <rect x="0" y="0" width="<%= width %>" height="40" fill="#fee" rx="6"/>
        <text x="20" y="25" fill="#c00" font-size="14" font-weight="500">
          ⚠ <%= warnings.map(({warning}) => warning.message).join(", ") %>
        </text>
      </g>
      <% yOffset += 50 %>
    <% } %>

    <!-- Render partials -->
    <% for (const partial of [...partials]) { %>
      <g class="partial-<%= partial %>" transform="translate(0, <%= yOffset %>)">
        <%- await include(`partials/${partial}.ejs`, {yOffset: 0, width, padding, lineHeight}) %>
      </g>
      <%
        // Each partial returns its height via a special variable
        // For now, we'll estimate based on partial type
        const heights = {
          'base.header': 120,
          'base.activity+community': 100,
          'base.repositories': 150,
          'languages': 180,
          'achievements': 200,
        }
        yOffset += heights[partial] || 100
      %>
    <% } %>

    <% if (base.metadata) { %>
      <!-- Footer Section -->
      <g class="footer-section" transform="translate(0, <%= yOffset %>)">
        <rect x="0" y="0" width="<%= width %>" height="1" fill="#e1e4e8" opacity="0.3"/>
        <text x="<%= width / 2 %>" y="20" text-anchor="middle" fill="#586069" font-size="11" opacity="0.7">
          <% if (account === "user") { %>
            <tspan>These metrics <%= !computed.token.scopes.includes("repo") ? "do not include all" : "include" %> private contributions</tspan>
            <tspan x="<%= width / 2 %>" dy="15">
          <% } %>
          Last updated <%= meta.generated %>
          <% if ((config.timezone?.name)&&(!config.timezone?.error)) { %>
            (timezone <%= config.timezone.name %>)
          <% } %>
          with lowlighter/metrics@<%= meta.version %>
          <% if (account === "user") { %>
            </tspan>
          <% } %>
        </text>
      </g>
      <% yOffset += 50 %>
    <% } %>

    <!-- End marker for height calculation -->
    <rect id="metrics-end" x="0" y="<%= yOffset %>" width="1" height="1" opacity="0"/>
  </g>

</svg>
